location /api/ { proxy_pass http://salafacil_backend; }
location = /api { proxy_pass http://salafacil_backend; }
location /health/ { proxy_pass http://salafacil_backend; }
location /assets/ { try_files $uri =404; expires 1y; }
location / { try_files $uri $uri/ /index.html; }
location @large_body {
  default_type application/json;
  return 400 '{"error":{"code":"VALIDATION_ERROR","message":"Corpo excede 32 KiB.","details":{}}}';
}
location @unavailable {
  default_type application/json;
  return 503 '{"error":{"code":"SERVICE_UNAVAILABLE","message":"Serviço temporariamente indisponível.","details":{}}}';
}

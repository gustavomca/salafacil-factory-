worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr crit;
events { worker_connections 512; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  client_max_body_size 32k;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  map $uri $route_category {
    default "spa";
    ~^/api/session/ "session";
    ~^/api/rooms "rooms";
    ~^/api/reservations "reservations";
    ~^/api/audit-events "audit";
    ~^/api/availability "availability";
    ~^/api/dashboard "dashboard";
    ~^/api "api";
    ~^/health/ "health";
    ~^/assets/ "asset";
  }
  log_format sanitized escape=json '{"level":"INFO","service":"web","method":"$request_method","route":"$route_category","status":$status,"duration":$request_time}';
  access_log /dev/stdout sanitized;
  sendfile on;
  include /tmp/salafacil-server.conf;
}
